name: Preview Down

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number"
        required: true
        type: string

permissions:
  contents: write
  deployments: write

jobs:
  teardown-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove preview
        run: |
          if [ -d "previews/pr-${{ inputs.pr }}" ]; then
            rm -rf "previews/pr-${{ inputs.pr }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove preview for PR #${{ inputs.pr }}"
            git push origin gh-pages
          else
            echo "Preview directory does not exist, skipping."
          fi

      - name: Mark deployment inactive
        uses: actions/github-script@v7
        with:
          script: |
            const environment = `preview/pr-${{ inputs.pr }}`;

            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment
            });

            for (const deployment of deployments.data) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Preview torn down'
              });
            }

            core.info(`Marked ${deployments.data.length} deployment(s) as inactive`);
