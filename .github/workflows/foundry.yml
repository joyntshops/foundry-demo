# Foundry: GitHub Issues → coding agent → verified PR into `integration`.
#
# Every run is one GitHub event. Foundry reads the event, rebuilds task state
# from the issue (labels + claim comment), performs the transition, and exits.
# State lives on GitHub, not on any machine.
#
# The only secret this workflow needs:
#   CLAUDE_CODE_OAUTH_TOKEN   from `claude setup-token`; bills your Claude plan.
#
# GitHub access uses the job's built-in token with the permissions below. No
# GitHub App is required. (Pass an App installation token as `github-token` if
# you later want CI to run on the PRs Foundry opens, or a named bot identity.)
name: Foundry

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]

# One job at a time per issue. A second event for the same issue waits.
concurrency:
  group: foundry-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write        # push branches
  issues: write          # labels, claim/status comments
  pull-requests: write   # open PRs, PR comments
  actions: write         # gh workflow run preview-up.yml / preview-down.yml
  deployments: write     # GitHub Deployment records for previews

jobs:
  foundry:
    # Start a runner only for events Foundry acts on.
    if: >-
      (github.event_name == 'issues' &&
        (github.event.label.name == 'state:ready' || github.event.label.name == 'state:claim')) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@foundry') &&
        !endsWith(github.event.comment.user.login, '[bot]')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Full history so origin/integration exists for worktrees and diffs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Foundry
        id: foundry
        uses: joyntshops/foundry@feat/github-action
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Keep the agent transcript
        if: always() && steps.foundry.outputs.log-dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: foundry-issue-${{ steps.foundry.outputs.issue }}-run-${{ github.run_id }}
          path: ${{ steps.foundry.outputs.log-dir }}
          if-no-files-found: ignore
          retention-days: 30
