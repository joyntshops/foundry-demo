# Foundry: GitHub Issues → coding agent → verified PR into `integration`.
#
# Every run is one GitHub event. Foundry reads the event, rebuilds task state
# from the issue (labels + claim comment), performs the transition, and exits.
# State lives on GitHub, not on any machine.
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN                     required. From `claude setup-token`;
#                                               bills your Claude plan.
#   FOUNDRY_APP_ID, FOUNDRY_APP_PRIVATE_KEY     optional. When both are set, Foundry
#                                               acts as that GitHub App: comments and
#                                               PRs carry the App's name, and its
#                                               pushes/PRs trigger other workflows (CI).
#                                               When absent, the job's built-in token
#                                               is used and everything still works.
#
# The App needs: issues, pull_requests, contents, actions, deployments (write).
name: Foundry

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]
  # Foundry dispatches itself to hand a command to another issue's job, e.g.
  # sending an agent to rebase after integration moved. workflow_dispatch is
  # delivered even when the job's own token caused it.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      command:
        description: "Foundry command: go | restart | stop"
        required: true
        type: string
      message:
        description: Message for the agent
        required: false
        type: string
        default: ""
  # Reconcile: an in-progress issue whose run died without cleanup is marked
  # failed once its status comment is older than reconcile_stale_minutes.
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write        # push branches
  issues: write          # labels, claim/status comments
  pull-requests: write   # open PRs, PR comments
  actions: write         # gh workflow run preview-up.yml / preview-down.yml
  deployments: write     # GitHub Deployment records for previews

jobs:
  foundry:
    # Start a runner only for events Foundry acts on. Comments: only `@foundry`
    # commands (go | restart | stop), only on issues (a PR comment carries the
    # PR number, not the issue), only from people associated with the repo;
    # the job then requires write permission before acting. Plain comments and
    # labels never start a run; the agent reads them at its next launch.
    if: >-
      (github.event_name == 'issue_comment' &&
        !endsWith(github.event.comment.user.login, '[bot]') &&
        !github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@foundry') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.merged == true ||
         github.event.pull_request.base.ref == 'main')) ||
      (github.event_name == 'pull_request_review' &&
        (github.event.review.state == 'changes_requested' || github.event.review.state == 'approved')) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # One job at a time per issue; a second actionable event for the same issue
    # waits. Declared on the job, not the workflow, so runs filtered out by the
    # `if:` above (Foundry's own comments and labels) never enter the group.
    # At workflow level they would queue and cancel each other, and could
    # cancel a pending human command.
    concurrency:
      group: foundry-${{ github.event.inputs.issue || github.event.issue.number || github.event.pull_request.number || github.event_name }}
      # `@foundry stop` cancels the issue's running job; everything else queues.
      cancel-in-progress: ${{ github.event_name == 'issue_comment' && contains(github.event.comment.body, '@foundry stop') }}

    # Secrets can't be read in a step's `if:`; surface the (non-sensitive) App ID
    # so the token-minting step can be skipped when no App is configured.
    env:
      FOUNDRY_APP_ID: ${{ secrets.FOUNDRY_APP_ID }}

    steps:
      - name: Mint GitHub App token (optional)
        id: app
        if: env.FOUNDRY_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FOUNDRY_APP_ID }}
          private-key: ${{ secrets.FOUNDRY_APP_PRIVATE_KEY }}

      # Full history so origin/integration exists for worktrees and diffs.
      # The token persisted here is what `git push` uses, so pushes are made
      # as the App when one is configured.
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          fetch-depth: 0

      - name: Foundry
        id: foundry
        uses: joyntshops/foundry@v0
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Keep the agent transcript
        if: always() && steps.foundry.outputs.log-dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: foundry-issue-${{ steps.foundry.outputs.issue }}-run-${{ github.run_id }}
          path: ${{ steps.foundry.outputs.log-dir }}
          if-no-files-found: ignore
          retention-days: 30
