repo: joyntshops/foundry-demo
labels:
  ready: state:ready
  in_progress: state:in-progress
  done: state:done
  ready_for_review: state:ready-for-human-review
  waiting_for_input: state:waiting-for-input
  failed: state:failed
  plan_review: state:plan-review
  claim: state:claim
mode_labels:
  plan: mode:plan
  auto: mode:auto
  default: mode:default
branch_template: feature/{issue}-{slug}
worktree_base: ./wts
tmux_template: foundry-{issue}
max_sessions: 4
max_verify_parallel: 1
verify: []
integration_rebuild: ""
comment_triggers:
  replan: "@foundry replan"
  restart: "@foundry restart"
  stop: "@foundry stop"
  continue: "@foundry continue"
  plan: "@foundry plan"
  start: "@foundry start"
  claim: "@foundry claim"
version_sources: []
tag_prefix: v
poll_interval_seconds: 30
default_agent_backend: claude-code
agent_backends:
  claude-code:
    type: command
    command: 'claude --dangerously-skip-permissions -p "You are working on issue #{issue_number}: {title}. The issue is at
      {issue_url}. Read the issue body and implement the task. When done, create a commit with your changes." --verbose
      --output-format stream-json 2>&1 | tee {log_dir}/agent.log'
    resume_command: claude --dangerously-skip-permissions -p '{prompt}' --resume "{session_id}" --verbose --output-format
      stream-json 2>&1 | tee {log_dir}/agent.log
  command:
    type: command
    command: echo "Configure your agent command in .joynt-foundry.yml"
agent_label_map:
  agent:claude: claude-code
github_backend: octokit
preview:
  mode: "provider"                        # "template" = URL from config, "provider" = URL from command output
  url_template: https://joyntshops.github.io/foundry-demo/previews/pr-{pr}/   # URL template
  up_command:  "gh workflow run preview-up.yml -f pr={pr} -f sha={sha} -f branch={branch}" # mode:provider — deploy command
  down_command: "gh workflow run preview-down.yml -f pr={pr}"  # mode:provider — teardown command
  comment: true    

